<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Desktop OS — Windows & macOS Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== 开机画面 ===== -->
  <div id="boot-screen">
    <div class="boot-logo">
      <svg viewBox="0 0 64 64" width="72" height="72" fill="none">
        <rect x="4" y="8" width="56" height="40" rx="3" stroke="currentColor" stroke-width="2.5"/>
        <rect x="22" y="48" width="20" height="4" rx="1" fill="currentColor"/>
        <rect x="16" y="52" width="32" height="4" rx="2" fill="currentColor"/>
      </svg>
    </div>
    <div class="boot-spinner"></div>
    <p class="boot-text">正在启动…</p>
  </div>

  <!-- ===== 桌面主体 ===== -->
  <div id="desktop" class="theme-windows">

    <!-- 桌面图标 -->
    <div id="desktop-icons">
      <div class="desktop-icon" data-app="files">
        <div class="icon-svg icon-folder"></div>
        <span>此电脑</span>
      </div>
      <div class="desktop-icon" data-app="notepad">
        <div class="icon-svg icon-notepad"></div>
        <span>记事本</span>
      </div>
      <div class="desktop-icon" data-app="calculator">
        <div class="icon-svg icon-calc"></div>
        <span>计算器</span>
      </div>
      <div class="desktop-icon" data-app="browser">
        <div class="icon-svg icon-browser"></div>
        <span>浏览器</span>
      </div>
      <div class="desktop-icon" data-app="terminal">
        <div class="icon-svg icon-terminal"></div>
        <span>终端</span>
      </div>
      <div class="desktop-icon" data-app="settings">
        <div class="icon-svg icon-settings"></div>
        <span>设置</span>
      </div>
      <div class="desktop-icon" data-app="about">
        <div class="icon-svg icon-about"></div>
        <span>关于本机</span>
      </div>
    </div>

    <!-- 窗口容器 -->
    <div id="windows-container"></div>

    <!-- ===== macOS 顶部菜单栏 ===== -->
    <div id="mac-menubar" class="mac-only">
      <div class="mb-left">
        <span class="mb-item mb-apple">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        </span>
        <span class="mb-item mb-app-name">Finder</span>
        <span class="mb-item">文件</span>
        <span class="mb-item">编辑</span>
        <span class="mb-item">显示</span>
        <span class="mb-item">前往</span>
        <span class="mb-item">窗口</span>
        <span class="mb-item">帮助</span>
      </div>
      <div class="mb-right">
        <span class="mb-item" title="电池">
          <svg viewBox="0 0 24 24" width="18" height="12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="6" width="18" height="12" rx="2"/><rect x="3" y="8" width="12" height="8" rx="1" fill="currentColor" stroke="none"/><rect x="20" y="9" width="2" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="mb-item" title="WiFi">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 18c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0-4c2.76 0 5.26 1.12 7.07 2.93l-1.41 1.41C16.22 16.57 14.21 15.6 12 15.6s-4.22.97-5.66 2.74L4.93 16.93C6.74 15.12 9.24 14 12 14zm0-4c4.14 0 7.89 1.68 10.6 4.39l-1.41 1.41C18.66 13.61 15.53 12.4 12 12.4s-6.66 1.21-9.19 3.4L1.4 14.39C4.11 11.68 7.86 10 12 10zm0-4c5.52 0 10.52 2.25 14.14 5.86l-1.41 1.41C21.27 10.45 16.91 8.4 12 8.4S2.73 10.45.27 13.27L-1.14 11.86C2.48 8.25 7.48 6 13 6z"/></svg>
        </span>
        <span class="mb-item" title="搜索">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        </span>
        <span class="mb-item" title="控制中心">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        </span>
        <span class="mb-item mb-clock" id="mac-clock">9:41</span>
      </div>
    </div>

    <!-- ===== macOS Dock ===== -->
    <div id="mac-dock" class="mac-only">
      <div class="dock-item" data-app="finder" title="访达">
        <div class="dock-icon icon-finder"></div>
      </div>
      <div class="dock-item" data-app="launcher" title="启动台">
        <div class="dock-icon icon-launchpad"></div>
      </div>
      <div class="dock-item" data-app="browser" title="浏览器">
        <div class="dock-icon icon-browser"></div>
      </div>
      <div class="dock-item" data-app="notepad" title="备忘录">
        <div class="dock-icon icon-notepad"></div>
      </div>
      <div class="dock-item" data-app="calculator" title="计算器">
        <div class="dock-icon icon-calc"></div>
      </div>
      <div class="dock-item" data-app="terminal" title="终端">
        <div class="dock-icon icon-terminal"></div>
      </div>
      <div class="dock-item" data-app="settings" title="系统设置">
        <div class="dock-icon icon-settings"></div>
      </div>
      <div class="dock-divider"></div>
      <div class="dock-item" data-app="trash" title="废纸篓">
        <div class="dock-icon icon-trash"></div>
      </div>
    </div>

    <!-- ===== Windows 任务栏 ===== -->
    <div id="win-taskbar" class="win-only">
      <div class="taskbar-center">
        <div class="taskbar-btn start-btn" id="win-start-btn" title="开始">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
        </div>
        <div class="taskbar-btn search-btn" title="搜索">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        </div>
        <div class="taskbar-btn taskbar-app" data-app="browser" title="浏览器">
          <div class="tb-icon icon-browser"></div>
        </div>
        <div class="taskbar-btn taskbar-app" data-app="notepad" title="记事本">
          <div class="tb-icon icon-notepad"></div>
        </div>
        <div class="taskbar-btn taskbar-app" data-app="files" title="文件资源管理器">
          <div class="tb-icon icon-folder"></div>
        </div>
        <div class="taskbar-btn taskbar-app" data-app="calculator" title="计算器">
          <div class="tb-icon icon-calc"></div>
        </div>
      </div>
      <div class="taskbar-right">
        <div class="tray-icons">
          <span class="tray-item" title="WiFi">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 18c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0-4c2.76 0 5.26 1.12 7.07 2.93l-1.41 1.41C16.22 16.57 14.21 15.6 12 15.6s-4.22.97-5.66 2.74L4.93 16.93C6.74 15.12 9.24 14 12 14zm0-4c4.14 0 7.89 1.68 10.6 4.39l-1.41 1.41C18.66 13.61 15.53 12.4 12 12.4s-6.66 1.21-9.19 3.4L1.4 14.39C4.11 11.68 7.86 10 12 10z"/></svg>
          </span>
          <span class="tray-item" title="音量">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </span>
          <span class="tray-item" title="电池">
            <svg viewBox="0 0 24 24" width="20" height="12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="6" width="18" height="12" rx="2"/><rect x="3" y="8" width="12" height="8" rx="1" fill="currentColor" stroke="none"/><rect x="20" y="9" width="2" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
          </span>
        </div>
        <div class="tray-clock" id="win-clock">
          <span class="clock-time">21:41</span>
          <span class="clock-date">2026/9/12</span>
        </div>
      </div>
    </div>

    <!-- ===== Windows 开始菜单 ===== -->
    <div id="win-start-menu" class="win-only">
      <div class="start-search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="搜索应用、设置和文档" id="start-search-input">
      </div>
      <div class="start-section">
        <div class="start-section-header">
          <span>已固定</span>
          <button class="start-all-apps-btn">所有应用 &rsaquo;</button>
        </div>
        <div class="start-apps-grid">
          <div class="start-app" data-app="browser"><div class="sa-icon icon-browser"></div><span>浏览器</span></div>
          <div class="start-app" data-app="notepad"><div class="sa-icon icon-notepad"></div><span>记事本</span></div>
          <div class="start-app" data-app="calculator"><div class="sa-icon icon-calc"></div><span>计算器</span></div>
          <div class="start-app" data-app="files"><div class="sa-icon icon-folder"></div><span>文件管理器</span></div>
          <div class="start-app" data-app="terminal"><div class="sa-icon icon-terminal"></div><span>终端</span></div>
          <div class="start-app" data-app="settings"><div class="sa-icon icon-settings"></div><span>设置</span></div>
          <div class="start-app" data-app="about"><div class="sa-icon icon-about"></div><span>关于本机</span></div>
          <div class="start-app" data-app="paint"><div class="sa-icon icon-paint"></div><span>画图</span></div>
        </div>
      </div>
      <div class="start-section">
        <div class="start-section-header"><span>推荐</span></div>
        <div class="start-recommended">
          <div class="rec-item"><div class="rec-icon icon-notepad"></div><div class="rec-info"><span class="rec-title">欢迎使用.txt</span><span class="rec-sub">刚刚</span></div></div>
          <div class="rec-item"><div class="rec-icon icon-folder"></div><div class="rec-info"><span class="rec-title">文档</span><span class="rec-sub">昨天</span></div></div>
        </div>
      </div>
      <div class="start-footer">
        <div class="start-user">
          <div class="user-avatar">U</div>
          <span>用户</span>
        </div>
        <button class="start-power" title="电源">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v10"/><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/></svg>
        </button>
      </div>
    </div>

    <!-- ===== macOS Launchpad ===== -->
    <div id="mac-launchpad" class="mac-only">
      <div class="launchpad-search">
        <input type="text" placeholder="搜索" id="launchpad-search-input">
      </div>
      <div class="launchpad-grid">
        <div class="lp-app" data-app="browser"><div class="lp-icon icon-browser"></div><span>浏览器</span></div>
        <div class="lp-app" data-app="notepad"><div class="lp-icon icon-notepad"></div><span>备忘录</span></div>
        <div class="lp-app" data-app="calculator"><div class="lp-icon icon-calc"></div><span>计算器</span></div>
        <div class="lp-app" data-app="files"><div class="lp-icon icon-folder"></div><span>访达</span></div>
        <div class="lp-app" data-app="terminal"><div class="lp-icon icon-terminal"></div><span>终端</span></div>
        <div class="lp-app" data-app="settings"><div class="lp-icon icon-settings"></div><span>系统设置</span></div>
        <div class="lp-app" data-app="about"><div class="lp-icon icon-about"></div><span>关于本机</span></div>
        <div class="lp-app" data-app="paint"><div class="lp-icon icon-paint"></div><span>画图</span></div>
      </div>
    </div>

    <!-- ===== 右键菜单 ===== -->
    <div id="context-menu">
      <div class="ctx-item" data-action="refresh">刷新</div>
      <div class="ctx-item" data-action="sort">排序方式</div>
      <div class="ctx-item" data-action="view">查看</div>
      <div class="ctx-divider"></div>
      <div class="ctx-item" data-action="new-folder">新建文件夹</div>
      <div class="ctx-item" data-action="display-settings">显示设置</div>
      <div class="ctx-divider"></div>
      <div class="ctx-item" data-action="switch-theme">切换主题 (Win/Mac)</div>
    </div>

    <!-- ===== 主题切换按钮 ===== -->
    <button id="theme-switch-btn" title="切换 Windows / macOS 主题">
      <svg class="ts-icon ts-win" viewBox="0 0 24 24" width="14" height="14"><rect x="3" y="3" width="8" height="8" rx="1" fill="currentColor"/><rect x="13" y="3" width="8" height="8" rx="1" fill="currentColor"/><rect x="3" y="13" width="8" height="8" rx="1" fill="currentColor"/><rect x="13" y="13" width="8" height="8" rx="1" fill="currentColor"/></svg>
      <svg class="ts-icon ts-mac" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
      <span id="theme-label">Windows</span>
    </button>

    <!-- ===== 下载源码按钮 ===== -->
    <button id="download-source-btn" title="下载 HTML / CSS / JS 源码文件">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>下载源码</span>
    </button>

    <!-- 下载提示 toast -->
    <div id="toast"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
